    <script>
      // Prevenir flash de tema claro antes de que Vue cargue
      (function() {
        var tema = localStorage.getItem('tema-oscuro')
        if (tema === 'false') {
          document.documentElement.classList.remove('dark')
        } else {
          document.documentElement.classList.add('dark')
        }
      })()
    </script>
